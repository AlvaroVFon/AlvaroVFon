name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Europe/Madrid

          # Contribution calendar only (includes private + public).
          # The README already has its own header, so skip the default base sections.
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
